[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "papr"
version = "0.2.0"
description = "Resolve scholarly references, fetch papers, and convert them to useful formats."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Cyrille Rossant"}]
dependencies = [
    "httpx>=0.27",
    "platformdirs>=4.0",
    "pypdf>=5.0",
    "rapidfuzz>=3.9",
    "rich>=13.9",
]

[project.optional-dependencies]
ucl = ["playwright>=1.50"]

[project.scripts]
papr = "papr.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/papr"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
